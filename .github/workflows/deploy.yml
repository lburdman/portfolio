name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege at workflow level. `ci` and `build` run untrusted pull-request
# code through `npm ci` lifecycle scripts, so they must never inherit deploy
# credentials — `pages: write` and `id-token: write` are granted on the `deploy`
# job only (AUDIT.md, Priority 4, MEDIUM).
permissions:
  contents: read

# Keyed per ref so pull requests do not serialise behind Pages deploys. The old
# workflow-level `group: pages` applied to `pull_request` too, so three pushes
# to one PR ran three full cycles back to back (AUDIT.md 3.4). The shared
# `pages` group now lives on the `deploy` job, where it belongs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── CI: the five gates, in the same order as `npm run verify` ─────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro generates `.astro/types.d.ts` from the content collections. Both
      # `lint` (type-aware rules on .astro frontmatter) and `type-check` resolve
      # `astro:content` through it, so it must exist before the gates run. On a
      # fresh checkout it does not.
      - name: Sync Astro types
        run: npx astro sync

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Build before the tests, mirroring `npm run verify`.
      #
      # Two suites read `dist/`. They do NOT depend on this step: `dist/` is
      # built for them by `tests/global-setup.ts`, once, with the Vite/Vitest
      # environment stripped back out — without that a build spawned from
      # inside a worker inherits `BASE_URL=/` and emits a site with no
      # deployment base at all. This step's value is that a broken build fails
      # here, under its own name, instead of surfacing as a confusing failure
      # inside the test gate.
      #
      # Yes, this means the site is built more than once per run. Correctness
      # beats twenty seconds.
      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      # `test:coverage`, not `test`: the thresholds in vitest.config.ts only
      # gate anything if the gate runs them. A decorative threshold is worse
      # than none — it reads as protection that is not there.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      # Content validation, including NETWORK liveness of every external
      # project link.
      #
      # This runs because the site shipped with three of its four "View on
      # GitHub" links pointing at repositories that do not exist. The schema
      # validated that a URL was well-formed and never asked whether anything
      # was there. Every gate was green while a recruiter clicking three of
      # four projects got a 404.
      #
      # It is deliberately the live check rather than `--offline`: a link
      # checker that never touches the network cannot catch the bug it exists
      # to catch. If GitHub rate-limits a run, switch this one step to
      # `npm run project:validate:offline` and fix it properly — do not delete
      # the step.
      - name: Validate project content and links
        run: npm run project:validate

  # ─── Build (gated on CI) ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  # ─── Deploy (main only, never on pull_request) ────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    # The only job that may touch Pages or mint an OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write

    # GitHub Pages allows one deployment at a time; queue rather than cancel so
    # a superseded deploy never leaves the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
